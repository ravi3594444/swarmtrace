[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmtrace"
version = "0.4.0"
description = "pytest for AI agents — trace, debug and catch regressions in LLM swarms"
readme = "README.md"
authors = [{ name = "Ravi" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
requires-python = ">=3.10"
dependencies = ["click", "rich"]

[project.optional-dependencies]
regression = ["litai"]
scraper    = ["scrapling"]
tools      = ["sentence-transformers", "faiss-cpu", "numpy"]
budget     = ["tiktoken"]
all        = ["litai", "scrapling", "sentence-transformers", "faiss-cpu", "numpy", "tiktoken"]

[project.scripts]
swarmtrace = "swarmtrace.cli:view"
swarmtrace-export = "swarmtrace.export:main"
swarmtrace-replay = "swarmtrace.cli:main_replay"

[tool.setuptools]
packages = ["swarmtrace"]

[tool.setuptools.package-data]
swarmtrace = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
