[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmtrace"
version = "0.7.3"
description = "pytest for AI agents — trace, debug and catch regressions in LLM swarms"
readme = "README.md"
authors = [{ name = "Ravi" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    # only list versions we've actually run the suite on
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = ["click", "rich"]

[project.urls]
Homepage      = "https://swarmtrace.vercel.app"
Repository    = "https://github.com/ravi3594444/swarmtrace"
Changelog     = "https://github.com/ravi3594444/swarmtrace/blob/main/CHANGELOG.md"
Issues        = "https://github.com/ravi3594444/swarmtrace/issues"
Documentation = "https://github.com/ravi3594444/swarmtrace#readme"

[project.optional-dependencies]
regression = ["litai"]
scraper    = ["scrapling"]
tools      = ["sentence-transformers", "faiss-cpu", "numpy"]
budget     = ["tiktoken"]
fov        = ["playwright", "watchdog"]
gateway    = ["mcp>=1,<2", "uvicorn"]
all        = ["litai", "scrapling", "sentence-transformers", "faiss-cpu", "numpy", "tiktoken", "playwright", "watchdog", "mcp>=1,<2", "uvicorn"]

[project.scripts]
swarmtrace = "swarmtrace.cli:view"
swarmtrace-export = "swarmtrace.export:main"
swarmtrace-replay = "swarmtrace.cli:main_replay"
swarmtrace-alerts = "swarmtrace.cli:main_alerts"
swarmtrace-resync = "swarmtrace.cli:main_resync"
swarmtrace-gateway = "swarmtrace.gateway_cli:main"
swarmtrace-otlp = "swarmtrace.otlp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarmtrace*"]

[tool.setuptools.package-data]
swarmtrace = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# `ruff check swarmtrace tests` must stay clean.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RET",      # return consistency
    "PIE",      # misc lints
    "ISC",      # implicit string concat
    "TID",      # tidy imports
    "DTZ",      # naive datetimes
    "RUF",      # ruff-specific (incl. RUF100 unused-noqa)
    "BLE",      # blind except, each needs a `# noqa: BLE001 -- why`
]
ignore = [
    # wraps at ~100 by convention, but some comments run over
    "E501",
    # non-ascii punctuation in comments/docstrings
    "RUF002", "RUF003",
    # misfires when a finally block also reads `result` (budget.py)
    "RET504",
]

[tool.ruff.lint.per-file-ignores]
# tests poke at private helpers on purpose
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# integration tests need a live Postgres (POSTGRES_TEST_URL), CI runs them separately
norecursedirs = [".git", ".venv", "dist", "build", "*.egg", "frontend-next", "node_modules"]
addopts = ["--ignore=tests/integration"]
markers = [
  "integration: tests that need a live Postgres (deselected by default)",
]
