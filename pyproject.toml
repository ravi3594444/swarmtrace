[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmtrace"
version = "0.6.8"
description = "pytest for AI agents — trace, debug and catch regressions in LLM swarms"
readme = "README.md"
authors = [{ name = "Ravi" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
requires-python = ">=3.10"
dependencies = ["click", "rich"]

[project.urls]
Homepage      = "https://swarmtrace.vercel.app"
Repository    = "https://github.com/ravi3594444/swarmtrace"
Changelog     = "https://github.com/ravi3594444/swarmtrace/blob/main/CHANGELOG.md"
Issues        = "https://github.com/ravi3594444/swarmtrace/issues"
Documentation = "https://github.com/ravi3594444/swarmtrace#readme"

[project.optional-dependencies]
regression = ["litai"]
scraper    = ["scrapling"]
tools      = ["sentence-transformers", "faiss-cpu", "numpy"]
budget     = ["tiktoken"]
fov        = ["playwright", "watchdog"]
gateway    = ["mcp>=1,<2", "uvicorn"]
all        = ["litai", "scrapling", "sentence-transformers", "faiss-cpu", "numpy", "tiktoken", "playwright", "watchdog", "mcp>=1,<2", "uvicorn"]

[project.scripts]
swarmtrace = "swarmtrace.cli:view"
swarmtrace-export = "swarmtrace.export:main"
swarmtrace-replay = "swarmtrace.cli:main_replay"
swarmtrace-alerts = "swarmtrace.cli:main_alerts"
swarmtrace-resync = "swarmtrace.cli:main_resync"
swarmtrace-gateway = "swarmtrace.gateway_cli:main"
swarmtrace-otlp = "swarmtrace.otlp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarmtrace*"]

[tool.setuptools.package-data]
swarmtrace = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests require a live Postgres (POSTGRES_TEST_URL) and are run
# by the dedicated CI job. Unit CI and bare `pytest` skip them by default.
norecursedirs = [".git", ".venv", "dist", "build", "*.egg", "frontend-next", "node_modules"]
addopts = ["--ignore=tests/integration"]
markers = [
  "integration: tests that need a live Postgres (deselected by default)",
]
