name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel 3.12 because 3.10 failed — when a version-specific
      # break happens, seeing which versions pass is most of the diagnosis.
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.10", so every version in
        # that range is a supported version and has to be tested. CI used to
        # run 3.12 only, which meant a 3.10 incompatibility — a match
        # statement, a 3.11+ stdlib call, a changed typing behaviour — would
        # only surface as a bug report from someone who had already
        # pip-installed it.
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: pip install -e ".[all,dev]" openai anthropic
      - name: Tests
        # Exclude tests/integration/ — those need a real Postgres and run in
        # the dedicated "integration" job below. Collecting them here either
        # skips/errors on missing POSTGRES_TEST_URL or doubles runtime.
        #
        # Coverage floor (fail_under) is configured in pyproject so `pytest
        # --cov` behaves identically here and on a contributor's machine.
        run: pytest -q --ignore=tests/integration --cov --cov-report=term

  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Lint/type results are version-independent here; pin the low end of
          # the supported range so mypy resolves against the oldest syntax we
          # promise to support.
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -e ".[all,dev]" openai anthropic
      - name: Lint
        # Was `--select E9,F63,F7,F82` — syntax errors and a few
        # always-wrong constructs, i.e. code that cannot run. It did not
        # catch code that runs and is wrong. The full ruleset now lives in
        # pyproject [tool.ruff.lint] with each ignore justified in place.
        run: ruff check swarmtrace tests
      - name: Type check
        # The package ships py.typed — it advertises type information to
        # every downstream user — but nothing verified that information.
        # The first run of this step found 14 errors, 4 of them live bugs.
        run: mypy

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-next/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Agent-derivation contract tests
        # Regression guard for the SDK<->API agent_id contract.
        # See scripts/test-derive-agent-cards.mjs for what this protects.
        run: npm test

  integration:
    name: Postgres integration tests
    runs-on: ubuntu-latest
    # Phase 4 of the audit fix plan. Spins up a real Postgres service
    # container, applies all supabase/migrations/*.sql in order, and runs
    # the SDK↔DB contract tests. This catches migration drift, RPC
    # signature changes, and the atomic-ingest idempotency trick (xmax=0)
    # — all things the mocked unit tests can't catch.
    #
    # Why this exists: 3 of this session's bugs (CLI crash, tree-view
    # wrap, grandchild flattening) shipped with 196+ tests passing because
    # nothing exercised the real DB. This job turns "found by hand" into
    # "caught in CI".
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Wait until Postgres is accepting connections before starting
        # the test job. Without this, the test runner might hit the DB
        # before it's ready and fail with a connection error.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        # psycopg2-binary is the Postgres driver — only needed for these
        # integration tests, not for the SDK itself.
        run: pip install -e . pytest psycopg2-binary
      - name: Run integration tests
        env:
          # Matches the service container credentials above.
          # Uses POSTGRES_TEST_URL (not DATABASE_URL) to avoid collision
          # with the SDK's own DB path env var.
          POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/test
        # Override pyproject addopts --ignore=tests/integration
        run: pytest tests/integration/ -v -o addopts=

