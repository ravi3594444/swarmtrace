name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.10, so test the floor as well as the newest.
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: pip install -e ".[all]" pytest ruff openai anthropic
      - name: Lint
        # Rules live in pyproject.toml. Same result on every interpreter, so
        # only run it once.
        if: matrix.python-version == '3.12'
        run: ruff check swarmtrace tests
      - name: Tests
        # tests/integration needs a real Postgres, see the integration job.
        run: pytest -q --ignore=tests/integration

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-next/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Agent-derivation contract tests
        # Guards the SDK<->API agent_id contract, see scripts/test-derive-agent-cards.mjs
        run: npm test

  integration:
    name: Postgres integration tests
    runs-on: ubuntu-latest
    # Runs the SDK<->DB contract tests against a real Postgres container.
    # Catches migration drift and RPC signature changes that the mocked unit
    # tests can't.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # don't start the steps until postgres accepts connections
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        # psycopg2 is only needed by the integration tests
        run: pip install -e . pytest psycopg2-binary
      - name: Run integration tests
        env:
          # matches the service credentials above; not DATABASE_URL so it
          # doesn't clash with the SDK's own env var
          POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/test
        # Override pyproject addopts --ignore=tests/integration
        run: pytest tests/integration/ -v -o addopts=

