stages:
  - test

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

python:tests:
  stage: test
  image: python:3.12
  script:
    - pip install -e . pytest ruff
    - ruff check --select E9,F63,F7,F82 swarmtrace tests
    - pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

frontend:typecheck:
  stage: test
  image: node:22
  script:
    - cd frontend-next
    - npm ci
    - npx tsc --noEmit
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
